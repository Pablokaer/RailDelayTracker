# Production overrides
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# ddl-auto is "validate" in the base profile now, in every environment — this used to be the one
# place it was set to "none", which let production run against a schema nothing had checked.
# Flyway owns the schema; Hibernate only confirms the entities still match it.

irishrail.analytics.overview-cache-ms=10000
