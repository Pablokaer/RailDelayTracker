# Production overrides
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
# Schema is owned by DatabaseIndexInitializer and AnalyticsAggregateService.ensureSchema; the
# entity tables have been stable for months. Skipping Hibernate's boot-time schema diff saves a
# scan of every table on each deploy.
spring.jpa.hibernate.ddl-auto=none
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
irishrail.analytics.overview-cache-ms=10000
