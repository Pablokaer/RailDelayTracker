spring.application.name=irishrail

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/irishrail
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (src/main/resources/db/migration), in every environment. It used to be
# ddl-auto=update here and ddl-auto=none in production, with the analytics tables and every index
# created from application code on top — so a fresh production database had no schema at all, and
# dev and prod could drift without anything noticing. "validate" now fails the boot if the entities
# and the migrated schema disagree.
spring.jpa.hibernate.ddl-auto=validate

# baseline-on-migrate covers the databases that were built by ddl-auto: a non-empty schema is
# baselined at version 0 and the migrations run over it. They are all idempotent
# (CREATE ... IF NOT EXISTS), so they are a no-op there and build the schema outright on a fresh
# database — one code path for both.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Off even in dev: it logged ~500 statements a minute synchronously from the collector thread.
# Re-enable locally when tracing a specific query.
spring.jpa.show-sql=false
# Release the pooled connection before the template renders rather than holding it for the whole
# request. Nothing here lazy-loads during rendering; the one entity endpoint JOIN FETCHes.
spring.jpa.open-in-view=false

# Java 21 virtual threads for request handling. The collector keeps its own bounded platform pool
# (see CollectorConfig) — that bound is what keeps upstream load polite and must not be lifted.
spring.threads.virtual.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Scheduling — the collector, the position refresher, the station directory, the SSE
# heartbeat and the aggregate roll-up are separate @Scheduled tasks. With the default pool size
# of 1 a slow collection cycle would starve all the others.
spring.task.scheduling.pool.size=6

# Static assets are versioned by hand; cache them at the edge for a day.
spring.web.resources.cache.cachecontrol.max-age=86400
# Content-hash suffix on /css, /js and /images URLs rendered by Thymeleaf, so a changed file is
# fetched again instead of waiting out the day-long cache above.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/images/**

# Health, readiness and metrics. This process is a collector that has to keep running unattended;
# before these its only signal was log output. /actuator/prometheus is the scrape endpoint.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=false

# Tomcat's 8 KB default covers the request line plus all headers, and it is enforced before the
# request reaches the app: the answer is a bare 400 with nothing logged above DEBUG. Localhost
# hits it by accident, because cookies are scoped by host and ignore the port — every other
# project served from localhost piles onto the same jar and all of it is sent here.
server.max-http-request-header-size=16KB

# Data retention — tiered on purpose.
#
# Measured on this database: raw snapshots cost ~278 bytes each at ~120k/day (~33 MB/day), while
# the three daily aggregate tables that feed every dashboard cost ~440 kB/day. Aggregates are
# therefore ~75x cheaper per day of history.
#
#   30 days of raw  -> ~1.0 GB, and covers every date filter the UI offers (today / yesterday /
#                      last 7 / last 30).
#   aggregate-days=0 -> keep aggregate history forever (~160 MB/year).
#
# NOTE: DELETE does not shrink the Postgres data files, it only frees space for reuse. Lowering
# this setting stops further growth but does not reclaim what is already allocated — run
# scripts/maintenance/reclaim-space.sql once for that.
irishrail.retention.days=30
irishrail.retention.aggregate-days=0
# The 03:00 sweep also runs once this long after each start, so retention holds even for an
# instance that is never up at 03:00 (or was restarted across it).
irishrail.retention.startup-delay-ms=45000

# Irish Rail API
irishrail.api.all-stations-url=https://api.irishrail.ie/realtime/realtime.asmx/getAllStationsXML_WithStationType?StationType=D
irishrail.api.station-list-base-url=https://api.irishrail.ie/realtime/realtime.asmx/getAllStationsXML_WithStationType?StationType=
# The station code is appended as a properly encoded query parameter, so this value stops at
# NumMins. (A legacy value ending in "&StationCode=" is still accepted and trimmed.)
irishrail.api.station-data-base-url=https://api.irishrail.ie/realtime/realtime.asmx/getStationDataByCodeXML_WithNumMins?NumMins=90
irishrail.api.current-trains-url=https://api.irishrail.ie/realtime/realtime.asmx/getCurrentTrainsXML
irishrail.api.train-movements-url=https://api.irishrail.ie/realtime/realtime.asmx/getTrainMovementsXML

# A train's stop sequence is fixed; only its expected times move, so a short cache is plenty.
irishrail.api.route-cache-ms=30000

# Timeouts are mandatory: the JDK default is infinite, which lets a slow upstream pin threads.
irishrail.api.connect-timeout-ms=4000
irishrail.api.read-timeout-ms=8000

# Station lists change a few times a year.
irishrail.api.station-cache-ms=3600000

# Departure boards fetched by the collector are served to /api/trains and the journey planner
# for this long, so N open tabs cost one upstream call per station per cycle instead of N. Just
# over the collection interval, so the cache is normally refreshed before it expires.
irishrail.api.board-cache-ms=35000

# Ceilings on the two board/route caches. They are Caffeine caches now rather than plain maps, so
# these are real bounds rather than a hope that the key space stays small.
irishrail.api.max-cached-boards=400
irishrail.api.max-cached-routes=400

# How often the server refreshes live positions. Clients read the cached snapshot, so this is
# the total upstream rate regardless of how many people have the map open.
irishrail.api.train-positions-refresh-ms=10000

# Delay collection
irishrail.collector.interval-ms=30000
irishrail.collector.threads=8
irishrail.collector.queue-capacity=512
irishrail.collector.cycle-budget-seconds=120

irishrail.connolly.collection-station-types=D
irishrail.heuston.collection-station-types=M,S
irishrail.tracked-station-codes=CNLLY,HSTON
irishrail.analytics.aggregates.backfill-on-startup=true
# How often changed trips are rolled up into the daily aggregates. Decoupled from the 30 s
# collection cycle: nobody notices analytics lagging a minute, and it takes the roll-up's cost
# out of the collector's critical path.
irishrail.analytics.aggregates.refresh-ms=60000
irishrail.analytics.overview-cache-ms=10000
irishrail.analytics.overview-cache-max-entries=200

irishrail.sse.heartbeat-ms=25000
# Hard ceiling on concurrent event-stream subscribers; past it /api/events answers 503 rather than
# accepting a stream every broadcast then has to walk.
irishrail.sse.max-clients=500

# Token-bucket throttle on /api/**, per client IP, per instance. The analytics endpoints are cheap
# to request and expensive to answer on a cache miss.
irishrail.rate-limit.enabled=true
irishrail.rate-limit.requests-per-minute=120
irishrail.rate-limit.burst=60

# Map tiles. tile.openstreetmap.org is not permitted for production traffic by the OSMF tile
# usage policy. CARTO's Positron was used until August 2026, when CARTO put its basemaps behind an
# API key: the tile server kept answering 200 but with an "API KEY REQUIRED" placeholder image, so
# Leaflet drew the placeholder as if it were the map.
#
# Esri's World Light Gray Canvas is the closest keyless replacement: an almost achromatic base
# that acts as a canvas and lets the delay colours carry the meaning. It tops out at zoom 16,
# which is plenty for a national network; the layer is capped so Leaflet never requests tiles
# that do not exist. Note the {z}/{y}/{x} order — Esri's, not the OSM convention.
#
# Alternatives (swap the URL, no code change):
#   .../Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}      dark counterpart
#   https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?api_key=...   CARTO, with a key
irishrail.map.tile-url=https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}
irishrail.map.tile-attribution=Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors
irishrail.map.tile-max-zoom=16

# The light canvas measures ~210/255 mean luminance, which is glaring inside this dark shell. This
# filter settles it clearly light but still at home in the page. Set to "none" for the raw
# basemap, or lower the brightness for a darker map.
irishrail.map.tile-filter=brightness(0.68) contrast(1.06) saturate(0.9)

# Physical rail network overlay (OpenRailwayMap), off by default and toggled in the UI. It is a
# volunteer-run service: attribute it and keep traffic reasonable.
irishrail.map.rail-overlay-url=https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png
irishrail.map.rail-overlay-attribution=Trilhos: <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>

irishrail.map.refresh-ms=10000
