<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Shared page chrome. Every template used to carry its own copy of the head assets,
  the analytics snippet and the header markup, which is how the map ended up without
  analytics and without HTML escaping.

  CDN assets carry Subresource Integrity hashes: without them a compromised CDN can
  serve arbitrary script into the app.
-->
<head>

<th:block th:fragment="analytics">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BSK6EC97T9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BSK6EC97T9');
    </script>
</th:block>

<th:block th:fragment="base-assets">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07131f">
    <link rel="icon" type="image/png" th:href="@{/images/logo_wolfhound.png}">
    <meta name="description" content="Live Irish Rail delays, punctuality analytics, a station-to-station journey planner and a real-time train map.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="IERailMetrics">
    <meta property="og:title" content="IERailMetrics — Live Irish Rail delays &amp; punctuality">
    <meta property="og:description" content="Live delays, punctuality analytics, journey planner and a real-time train map for Irish Rail.">
    <meta property="og:url" th:content="${siteUrl}">
    <meta property="og:image" th:content="${siteUrl + '/images/og-image.png'}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="IERailMetrics wolfhound logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="IERailMetrics — Live Irish Rail delays &amp; punctuality">
    <meta name="twitter:description" content="Live delays, punctuality analytics, journey planner and a real-time train map for Irish Rail.">
    <meta name="twitter:image" th:content="${siteUrl + '/images/og-image.png'}">
    <!-- Every vendor asset comes from this one origin (Leaflet used to come from unpkg, a third
         DNS lookup and TLS handshake on the critical path); open the connection before the parser
         reaches the first stylesheet. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"
          integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
          crossorigin="anonymous">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:src="@{/js/app.js}"></script>
</th:block>

<th:block th:fragment="chartjs">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
            integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF"
            crossorigin="anonymous"></script>
</th:block>

<th:block th:fragment="bootstrap-js">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</th:block>

<th:block th:fragment="leaflet-css">
    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
          rel="stylesheet"
          integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
          crossorigin="anonymous">
</th:block>

<th:block th:fragment="leaflet-js">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
            crossorigin="anonymous"></script>
</th:block>

</head>
<body>

<!--
  site-header(pageTitle, pageSubtitle, showNavSelect, liveLabel, updatedAt, navHandler)
  `showNavSelect` false for pages whose own body owns the station pickers (journey).
  `liveLabel` null hides the live pill entirely (overview).
  `navHandler` is the JS function the selector calls — usually `changeView` from app.js,
  but the overview swaps scope in place instead of navigating, so it passes its own.
-->
<th:block th:fragment="site-header(pageTitle, pageSubtitle, showNavSelect, liveLabel, updatedAt, navHandler)">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Primary navigation">
        <a class="sidebar-brand" href="/overview" aria-label="IERailMetrics home">
            <img class="sidebar-logo" th:src="@{/images/logo_wolfhound.png}" alt="">
            <span><strong>IE</strong>RailMetrics</span>
        </a>
        <button class="nav-close" type="button" aria-label="Close navigation"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        <div class="sidebar-section">Navigate</div>
        <nav class="sidebar-nav">
            <a href="/overview" data-nav-path="/overview" title="Overview"><i class="bi bi-house-door-fill"></i><span>Overview</span></a>
            <a href="/get" data-nav-path="/get" title="Stations"><i class="bi bi-geo-alt-fill"></i><span>Stations</span></a>
            <a href="/journey" data-nav-path="/journey" title="Journey Planner"><i class="bi bi-train-front-fill"></i><span>Journey Planner</span></a>
            <a href="/map" data-nav-path="/map" title="Live Map"><i class="bi bi-map-fill"></i><span>Live Map</span></a>
            <a href="/overview#station-ranking" title="Reports"><i class="bi bi-bar-chart-fill"></i><span>Reports</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-status">
                <span><i class="live-dot"></i> Live data</span>
                <small>Last updated <time class="sidebar-clock">--:--:--</time></small>
            </div>
            <button class="sidebar-toggle" type="button" aria-label="Collapse navigation" aria-controls="app-sidebar" aria-expanded="true" title="Collapse navigation">
                <i class="bi bi-chevron-bar-left" aria-hidden="true"></i><span>Collapse</span>
            </button>
        </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
    <header class="site-header">
        <div class="container-fluid px-4 header-content">
            <div class="header-row">
                <button class="nav-open" type="button" aria-label="Open navigation" aria-controls="app-sidebar" aria-expanded="false">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <div class="header-titles">
                    <div class="title-line">
                        <div class="fw-bold lh-1" id="page-title" th:text="${pageTitle}">IERailMetrics</div>
                        <div class="live-pill" id="live-pill" th:if="${liveLabel != null}"><span class="live-dot"></span><span th:text="${liveLabel}">LIVE</span></div>
                    </div>
                    <div class="page-subtitle" th:text="${pageSubtitle}">Irish Rail</div>
                </div>
                <div class="header-select" th:if="${showNavSelect}">
                    <select class="station-select" id="station-selector"
                            aria-label="Switch view or station"
                            th:attr="onchange=${navHandler} + '(this.value)'">
                        <option value="MAP" th:selected="${selectedCode == 'MAP'}">Train Map</option>
                        <option value="JOURNEY" th:selected="${selectedCode == 'JOURNEY'}">Journey Planner</option>
                        <option value="OVERVIEW" th:selected="${selectedCode == 'OVERVIEW'}">Overview — All Stations</option>
                        <option th:each="s : ${stations}"
                                th:value="${s.stationCode}"
                                th:text="${s.stationDesc}"
                                th:selected="${s.stationCode == selectedCode}"></option>
                    </select>
                </div>
                <div class="header-status" th:if="${liveLabel != null}">
                    <div class="header-updated">
                        Updated <span id="clock" th:text="${updatedAt ?: '--:--:--'}">--:--:--</span>
                    </div>
                </div>
            </div>
        </div>
    </header>
</th:block>

</body>
</html>
